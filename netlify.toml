[build]
  publish = "."
  functions = "netlify/functions"

# ------------------------------------------------------------------------------
# Security: Block public access to internal server sources, configs and archives
# ------------------------------------------------------------------------------

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.ts"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.zip"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/drizzle.config.ts"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/outil-annonces.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/annonces.exemple.json"
  to = "/404.html"
  status = 404
  force = true

# Exact-path rules: Netlify splats only match at the end of a path, so
# patterns such as "/*.md" do not match "/LISEZMOI-DEPOT.md".
[[redirects]]
  from = "/LISEZMOI-DEPOT.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# ------------------------------------------------------------------------------
# Security Headers
# ------------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
